<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MotoGP - Resultados</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
    <style>
      body {
        background: #0f0f0f;
        min-height: 100vh;
      }
      .table {
        --bs-table-bg: #1a1a1a;
        --bs-table-border-color: #444;
      }
      .header-stripe-warning {
        height: 3px;
      }
      .header-stripe-danger {
        height: 2px;
      }
      .table-dark thead {
        --bs-table-bg: #000;
      }
      .pos-col {
        width: 100px;
      }
    </style>
  </head>
  <body class="text-light">
  <div class="bg-warning header-stripe-warning"></div>
  <div class="bg-danger header-stripe-danger"></div>

    <nav th:replace="~{fragmentos/navbar :: navbar}"></nav>

    <div class="container py-5">
      <div class="row mb-4">
        <div class="col-12">
          <a href="/carreras" class="btn btn-outline-warning mb-3">
            ← Volver a Carreras
          </a>
          <h1 class="display-3 fw-bold mb-2">
            <span class="text-warning">RESULTADOS</span>
            <span class="text-danger">GP</span>
          </h1>
          <p class="lead text-light fs-4" th:text="${carrera.nombreCircuito}">
            Nombre del Circuito
          </p>
        </div>
      </div>

      <div class="row mb-4" th:if="${not #lists.isEmpty(resultados)}">
        <div class="col-12">
            <div class="p-4 border border-warning rounded bg-dark shadow">
                <div class="d-flex align-items-center">
                    <div class="display-1 me-4">🏆</div>
                    <div>
                        <h5 class="text-secondary text-uppercase mb-1">Ganador del Gran Premio</h5>
                        <h2 class="display-5 fw-bold text-warning mb-0" th:text="${resultados[0].piloto.nombre}">Nombre Ganador</h2>
                        <p class="fs-4 text-light mb-0" th:text="${resultados[0].piloto.equipo?.nombre}">Equipo</p>
                    </div>
                </div>
            </div>
        </div>
      </div>

      <div class="row">
        <div class="col-12">
            <div class="table-responsive shadow-lg">
              <table class="table table-dark align-middle border border-warning">
                <thead class="table-dark">
                  <tr>
                    <th scope="col" class="text-warning fs-5 text-center pos-col">Pos.</th>
                    <th scope="col" class="text-warning fs-5">Piloto</th>
                    <th scope="col" class="text-warning fs-5">Equipo</th>
                  </tr>
                </thead>
                <tbody>
                  <tr th:each="res : ${resultados}">
                    
                    <td class="text-center fw-bold fs-4">
                        <span th:if="${res.posicion == 1}" title="Ganador">🥇</span>
                        <span th:if="${res.posicion == 2}" title="Segundo">🥈</span>
                        <span th:if="${res.posicion == 3}" title="Tercero">🥉</span>
                        <span th:if="${res.posicion > 3}" th:text="${res.posicion}" class="text-secondary">4</span>
                    </td>

                    <td class="fw-bold fs-5" th:text="${res.piloto.nombre}">
                      Nombre Piloto
                    </td>

                    <td class="text-secondary" th:text="${res.piloto.equipo?.nombre}">
                      Nombre Equipo
                    </td>
                  </tr>
                  
                  <tr th:if="${#lists.isEmpty(resultados)}">
                    <td colspan="3" class="text-center py-4 text-muted">
                        No hay datos disponibles.
                    </td>
                  </tr>
                </tbody>
              </table>
            </div>
        </div>
      </div>

    </div>

    <footer class="bg-black text-white py-4 mt-5 border-top border-warning">
      <div class="container text-center">
        <p class="mb-0">
          <span class="text-warning fw-bold">MOTO</span><span class="text-danger fw-bold">GP</span>
          &copy; 2025 - Todos los derechos reservados
        </p>
      </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>

<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Detalles del Piloto</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-8">
                <div class="card shadow">
                    <div class="card-header bg-primary text-white">
                        <h1 class="h3 mb-0">Detalles del Piloto</h1>
                    </div>
                    <div class="card-body">
                        <h2 class="h4 mb-4 text-center" th:text="${piloto.nombre}">Nombre del Piloto</h2>
                        
                        <div class="mb-4">
                            <p class="mb-2"><strong>Carreras:</strong> <span class="badge bg-secondary" th:text="${piloto.num_carreras}">0</span></p>
                            <p class="mb-2"><strong>Equipo:</strong> <span class="text-muted" th:text="${piloto.equipo.nombre}">Equipo</span></p>
                        </div>
                        
                        <div class="alert alert-info" th:if="${piloto.moto != null}">
                            <h3 class="h5 mb-3">Información de la Moto</h3>
                            <p class="mb-2"><strong>Nombre:</strong> <span th:text="${piloto.moto.marca}">Marca Moto</span></p>
                            <p class="mb-0"><strong>Cilindrada:</strong> <span th:text="${piloto.moto.cilindrada}">0</span> cc</p>
                            <p class="mb-0"><strong>Tipo motor:</strong> <span th:text="${piloto.moto.tipoMotor}">0</span></p>
                            <p class="mb-0"><strong>Porcentaje Desgaste:</strong> <span th:text="${piloto.moto.porcentDesgaste}">0</span> %</p>
                        </div>
                        
                        <div class="d-flex gap-2 justify-content-between mt-4">
                            <a th:href="@{/pilotos}" class="btn btn-secondary">Volver a la lista</a>
                            <a th:href="@{/pilotos/editar/{id}(id=${piloto.id})}" class="btn btn-warning">Editar</a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>

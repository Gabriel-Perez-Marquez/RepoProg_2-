<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org" data-bs-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MotoGP - Clasificación</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
  </head>
  <body class="d-flex flex-column min-vh-100 bg-black">
    
    <!-- Barras decorativas usando utilidades de fondo y altura -->
    <div class="bg-warning" style="height: 4px;"></div>
    <div class="bg-danger" style="height: 3px;"></div>

    <!-- Navbar -->
    <nav th:replace="~{fragmentos/navbar :: navbar}"></nav>

    <div class="container py-5 flex-grow-1">
      
      <h1 class="display-4 fw-bold text-center mb-5 text-uppercase">
        <span class="text-light">Clasificación</span> <span class="text-danger">Mundial</span>
      </h1>

      <!-- Pestañas (Nav Pills) -->
      <ul class="nav nav-pills nav-fill mb-4 gap-2" id="pills-tab" role="tablist">
        <li class="nav-item" role="presentation">
          <button class="nav-link active fw-bold fs-5 border border-warning" id="pills-pilotos-tab" data-bs-toggle="pill" data-bs-target="#pills-pilotos" type="button" role="tab">
            🏍️ Pilotos
          </button>
        </li>
       
      </ul>

      <div class="tab-content" id="pills-tabContent">
        
        <!-- TABLA PILOTOS -->
        <div class="tab-pane fade show active" id="pills-pilotos" role="tabpanel">
            <div class="card border-warning shadow">
                <div class="card-body p-0 table-responsive">
                    <table class="table table-hover table-striped align-middle mb-0">
                        <thead class="table-dark text-uppercase">
                            <tr>
                                <th class="py-3 ps-4">Pos</th>
                                <th class="py-3">Piloto</th>
                                <th class="py-3">Equipo</th>
                                <th class="py-3 text-center">Vic.</th>
                                <th class="py-3 text-center">Podios</th>
                                <th class="py-3 pe-4 text-end text-warning fw-bold fs-5">Puntos</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="piloto, stat : ${pilotos}">
                                <td class="ps-4">
                                    <!-- Lógica de colores con clases de Bootstrap -->
                                    <span class="fs-4 fw-bold" 
                                          th:classappend="${stat.count == 1 ? 'text-warning' : (stat.count == 2 ? 'text-secondary' : (stat.count == 3 ? 'text-danger' : 'text-light'))}"
                                          th:text="${stat.count}">1</span>
                                    <span th:if="${stat.count == 1}" class="ms-1">🏆</span>
                                </td>
                                <td>
                                    <div class="d-flex align-items-center">
                                        <span class="fw-bold fs-5" th:text="${piloto.nombre}">Nombre</span>
                                    </div>
                                </td>
                                <td class="text-secondary" th:text="${piloto.equipo?.nombre}">Equipo</td>
                                <td class="text-center opacity-75" th:text="${piloto.totalVictorias}">0</td>
                                <td class="text-center opacity-75" th:text="${piloto.totalPodios}">0</td>
                                <td class="pe-4 text-end text-warning fw-bold fs-4" th:text="${piloto.totalPuntos}">0</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>

        
    </div>

    <!-- Footer -->
    <footer class="bg-body-tertiary py-4 mt-auto border-top border-warning" style="--bs-bg-opacity: .1;">
        <div class="container text-center">
          <p class="mb-0 text-muted">
            <span class="text-warning fw-bold">MOTO</span><span class="text-danger fw-bold">GP</span>
            &copy; 2025 - Campeonato Mundial
          </p>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>

<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org" data-bs-theme="dark">
  <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>MotoGP - Detalles Temporada</title>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
        <style>
            .header-stripe-warning {
                height: 4px;
            }
            .header-stripe-danger {
                height: 3px;
            }
            .footer-bg-opacity {
                --bs-bg-opacity: .1;
            }
        </style>
  </head>
  <body class="d-flex flex-column min-vh-100 bg-black">
    
    <div class="bg-warning header-stripe-warning"></div>
    <div class="bg-danger header-stripe-danger"></div>

    <nav th:replace="~{fragmentos/navbar :: navbar}"></nav>

    <div class="container py-5 flex-grow-1">
      
      <!-- Cabecera -->
      <div class="row mb-4">
        <div class="col-12">
            <a href="/temporadas" class="btn btn-outline-secondary btn-sm mb-2">&larr; Volver</a>
            <h1 class="display-4 fw-bold text-warning" th:text="${temporada.nombre}">Temporada 2025</h1> 
        </div>
      </div>

      <!-- Pestañas -->
      <ul class="nav nav-tabs border-warning mb-4" id="seasonTab" role="tablist">
        <li class="nav-item" role="presentation">
            <button class="nav-link active fw-bold text-warning" id="calendario-tab" data-bs-toggle="tab" data-bs-target="#calendario" type="button" role="tab">
                📅 Calendario de Carreras
            </button>
        </li>
        <li class="nav-item" role="presentation">
            <button class="nav-link fw-bold text-danger" id="clasificacion-tab" data-bs-toggle="tab" data-bs-target="#clasificacion" type="button" role="tab">
                🏆 Clasificación Temporada
            </button>
        </li>
      </ul>

      <div class="tab-content" id="seasonTabContent">
        
        <!-- PANEL CALENDARIO -->
        <div class="tab-pane fade show active" id="calendario" role="tabpanel">
            
            <div class="list-group" th:if="${not #lists.isEmpty(temporada.carreras)}">
                <div th:each="carrera : ${temporada.carreras}" class="list-group-item list-group-item-action bg-dark text-light border-secondary p-3 mb-2 rounded d-flex justify-content-between align-items-center">
                    
                    <!-- Info Carrera -->
                    <div>
                        <h5 class="mb-1 fw-bold text-warning" th:text="${carrera.nombreCircuito}">Circuito</h5>
                        <small class="text-muted" th:text="${#temporals.format(carrera.fecha, 'dd MMMM yyyy')}">Fecha</small>
                        <span th:if="${carrera.jugada}" class="badge bg-success ms-2">Finalizada</span>
                        <span th:unless="${carrera.jugada}" class="badge bg-secondary ms-2">Pendiente</span>
                    </div>

                    <!-- Botones -->
                    <div>
                        <a th:if="${!carrera.jugada}" th:href="@{/carreras/jugar/{id}(id=${carrera.id})}" class="btn btn-success btn-sm fw-bold">
                            🏁 Jugar
                        </a>
                        <a th:if="${carrera.jugada}" th:href="@{/carreras/resultados/{id}(id=${carrera.id})}" class="btn btn-outline-warning btn-sm fw-bold">
                            Ver Resultados
                        </a>
                    </div>

                </div>
            </div>

            <!-- Mensaje si no hay carreras -->
            <div th:if="${#lists.isEmpty(temporada.carreras)}" class="alert alert-dark border-warning text-center mt-3">
                No hay carreras programadas para esta temporada. 
                <a href="/carreras/new" class="alert-link text-warning">¡Crea una ahora!</a>
            </div>

        </div>

        <!-- PANEL CLASIFICACIÓN -->
        <div class="tab-pane fade" id="clasificacion" role="tabpanel">
            <div class="row">
                <!-- Tabla Pilotos -->
                <div class="col-lg-6 mb-4">
                    <div class="card border-warning h-100">
                        <div class="card-header bg-warning text-dark fw-bold">Pilotos</div>
                        <div class="card-body p-0 table-responsive">
                            <table class="table table-dark table-hover mb-0">
                                <thead>
                                    <tr>
                                        <th class="ps-3">#</th>
                                        <th>Piloto</th>
                                        <th class="text-end pe-3">Pts</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    <tr th:each="piloto, st : ${pilotos}"> <!-- Top 10 -->
                                        <td class="ps-3 text-muted" th:text="${st.count}">1</td>
                                        <td>
                                            <span class="fw-bold" th:text="${piloto.nombre}">Nombre</span>
                                            <small class="d-block text-secondary" th:text="${piloto.equipo?.nombre}">Equipo</small>
                                        </td>
                                        <td class="text-end pe-3 fw-bold text-warning fs-5" th:text="${piloto.totalPuntos}">0</td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>

                <!-- Tabla Equipos -->
                <div class="col-lg-6 mb-4">
                    <div class="card border-danger h-100">
                        <div class="card-header bg-danger text-white fw-bold">Constructores</div>
                        <div class="card-body p-0 table-responsive">
                            <table class="table table-dark table-hover mb-0">
                                <thead>
                                    <tr>
                                        <th class="ps-3">#</th>
                                        <th>Equipo</th>
                                        <th class="text-end pe-3">Pts</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    <tr th:each="equipo, st : ${equipos}">
                                        <td class="ps-3 text-muted" th:text="${st.count}">1</td>
                                        <td th:text="${equipo.nombre}">Nombre</td>
                                        <td class="text-end pe-3 fw-bold text-danger fs-5" th:text="${equipo.totalPuntos}">0</td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>
        </div>

      </div>
    </div>

    <footer class="bg-body-tertiary py-4 mt-auto border-top border-warning footer-bg-opacity">
      <div class="container text-center">
        <p class="mb-0 text-muted">MotoGP 2025</p>
      </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>

<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MotoGP - Agregar Equipo</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <style>
      body {
        background: #0f0f0f;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
      }
      .content-wrapper {
        flex: 1;
      }
    </style>
  </head>
  <body>
    <div class="content-wrapper">
    <!-- Header stripes -->
    <div class="bg-warning" style="height: 3px;"></div>
    <div class="bg-danger" style="height: 2px;"></div>

    <nav th:replace="~{fragmentos/navbar :: navbar}"></nav>

    <!-- Main Content -->
    <div class="container py-4">
        <!-- Page Header -->
        <div class="row mb-4">
            <div class="col-12">
                <a href="/equipos" class="btn btn-outline-warning mb-3">← Volver a Equipos</a>
                <h1 class="display-5 fw-bold mb-2">
                    <span class="text-warning" th:text="${equipo.id == null} ? 'AGREGAR' : 'EDITAR'">AGREGAR</span>
                    <span class="text-danger">EQUIPO</span>
                </h1>
            </div>
        </div>

        <!-- Formulario -->
        <div class="row justify-content-center">
            <div class="col-lg-8">
                <div class="card bg-black text-white border-0 shadow-lg position-relative overflow-hidden">
                    <div class="position-absolute w-100 h-100"
                         style="background: linear-gradient(135deg, rgba(220,53,69,0.1) 0%, rgba(255,193,7,0.1) 100%); z-index: 0;"></div>
                    <div class="position-absolute top-0 w-100" style="height: 4px; background: linear-gradient(90deg, #dc3545 0%, #ffc107 100%); z-index: 1;"></div>

                    <div class="position-relative p-4" style="z-index: 2;">
                        <form th:object="${equipo}" th:action="@{/equipos/save}" method="post">
                            <!-- ID oculto para edición -->
                            <input type="hidden" th:field="*{id}"/>

                            <!-- Datos básicos -->
                            <div class="mb-3">
                                <label for="nombre" class="form-label text-warning fw-bold">Nombre del Equipo</label>
                                <input th:field="*{nombre}" type="text" class="form-control bg-dark text-white border-warning"
                                       id="nombre" placeholder="Nombre del equipo" required>
                            </div>

                            <div class="row mb-3">
                                <div class="col-md-6">
                                    <label for="dinero" class="form-label text-warning fw-bold">Presupuesto (€)</label>
                                    <input th:field="*{dinero}" type="number" step="0.01" min="0"
                                           class="form-control bg-dark text-white border-warning" id="dinero" required>
                                </div>
                                <div class="col-md-6">
                                    <label for="puntos" class="form-label text-warning fw-bold">Puntos</label>
                                    <input th:field="*{puntos}" type="number" min="0"
                                           class="form-control bg-dark text-white border-warning" id="puntos">
                                </div>
                            </div>

                            <!-- Clasificación -->
                            <div class="mb-3">
                                <label for="clasificacionId" class="form-label text-warning fw-bold">Clasificación</label>
                                <select name="clasificacionId" id="clasificacionId"
                                        class="form-select bg-dark text-white border-warning" th:field="*{clasificacion}">
                                    <option value="" th:selected="${equipo.clasificacion == null}">-- Sin clasificación --</option>
                                    <option th:each="c : ${clasificaciones}"
                                            th:value="${c.id}"
                                            th:text="${c.nombre}"
                                            th:selected="${equipo.clasificacion != null and equipo.clasificacion.id == c.id}">
                                    </option>
                                </select>
                            </div>

                            <!-- Patrocinador -->
                            <div class="mb-3">
                                <label for="patrocinador" class="form-label text-warning fw-bold">Patrocinador</label>
                                <select th:field="*{patrocinador}" id="patrocinador"
                                        class="form-select bg-dark text-white border-warning">
                                    <option value="">-- Sin patrocinador --</option>
                                    <option th:each="p : ${patrocinadores}"
                                            th:value="${p}"
                                            th:text="${p}">
                                    </option>
                                </select>
                            </div>

                            <!-- Carreras -->
                            <div class="mb-3">
                                <label for="carrerasIds" class="form-label text-warning fw-bold">Carreras</label>
                                <select name="carrerasIds" id="carrerasIds" multiple size="6"
                                        class="form-select bg-dark text-white border-warning"
                                        th:field="*{carreras}">
                                    <option th:each="c : ${carreras}"
                                            th:value="${c.id}"
                                            th:text="${c.nombreCircuito}"
                                            th:selected="${equipo.carreras != null and equipo.carreras.contains(c)}">
                                    </option>
                                </select>
                                <small class="text-secondary">Mantén Ctrl/Cmd para seleccionar varias.</small>
                            </div>

                            <!-- Pilotos -->
                            <div class="mb-3">
                                <label for="pilotosIds" class="form-label text-warning fw-bold">Pilotos</label>
                                <select name="pilotosIds" id="pilotosIds" multiple size="6"
                                        class="form-select bg-dark text-white border-warning"
                                        th:field="*{pilotos}">
                                    <option th:each="p : ${pilotos}"
                                            th:value="${p.id}"
                                            th:text="${p.nombre}"
                                            th:selected="${equipo.pilotos != null and equipo.pilotos.contains(p)}">
                                    </option>
                                </select>
                                <small class="text-secondary">Mantén Ctrl/Cmd para seleccionar varias.</small>
                            </div>

                            <div class="d-flex gap-2">
                                <a href="/equipos" class="btn btn-outline-warning">← Volver</a>
                                <button type="submit" class="btn btn-danger">Guardar</button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>

    </div>
</div>

<footer class="bg-black text-white py-4 mt-5 border-top border-warning">
    <div class="container text-center">
        <p class="mb-0">
            <span class="text-warning fw-bold">MOTO</span><span class="text-danger fw-bold">GP</span>
            &copy; 2025 - Todos los derechos reservados
        </p>
    </div>
</footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>

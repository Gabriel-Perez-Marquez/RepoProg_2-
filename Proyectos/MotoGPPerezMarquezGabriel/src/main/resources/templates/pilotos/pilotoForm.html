<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MotoGP - Agregar Piloto</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
    <style>
      body {
        background: #0f0f0f;
      }
    </style>
  </head>
  <body>
    <!-- Header stripes -->
    <div class="bg-warning" style="height: 3px"></div>
    <div class="bg-danger" style="height: 2px"></div>

    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-black border-bottom border-warning">
      <div class="container">
        <a class="navbar-brand fw-bold fs-3" href="/">
          <span class="text-warning">MOTO</span><span class="text-danger">GP</span>
        </a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
          <ul class="navbar-nav ms-auto">
            <li class="nav-item">
              <a class="nav-link" href="/">Inicio</a>
            </li>
            <li class="nav-item">
              <a class="nav-link active text-warning" href="/pilotos">Pilotos</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="/equipos">Equipos</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="/carreras">Carreras</a>
            </li>
          </ul>
        </div>
      </div>
    </nav>

    <!-- Main Content -->
    <div class="container py-4 pb-5">
      <!-- Page Header -->
      <div class="row mb-4">
        <div class="col-12">
          <a href="/pilotos" class="btn btn-outline-warning mb-3">
            ← Volver a Pilotos
          </a>
          <h1 class="display-5 fw-bold mb-2">
            <span class="text-warning">AGREGAR</span>
            <span class="text-danger">PILOTO</span>
          </h1>
        </div>
      </div>

      <!-- Formulario -->
      <div class="row justify-content-center">
        <div class="col-lg-8">
          <div class="card bg-black text-white border-0 shadow-lg position-relative">
            <!-- Efecto de fondo con gradiente -->
            <div class="position-absolute w-100 h-100" style="background: linear-gradient(135deg, rgba(220, 53, 69, 0.1) 0%, rgba(255, 193, 7, 0.1) 100%); z-index: 0;"></div>
            <!-- Borde superior decorativo -->
            <div class="position-absolute top-0 w-100" style="height: 4px; background: linear-gradient(90deg, #dc3545 0%, #ffc107 100%); z-index: 1;"></div>
            <div class="position-relative p-4" style="z-index: 2">
              <form th:object="${piloto}" th:action="@{/pilotos/save}" method="post">
                <input type="hidden" th:field="*{id}" />
                <div class="mb-3">
                  <label for="nombre" class="form-label text-warning fw-bold">Nombre del Piloto</label>
                  <input type="text" class="form-control bg-dark text-white border-warning" id="nombre" th:field="*{nombre}" placeholder="Nombre del piloto" required />
                </div>
                <div class="mb-3">
                  <label for="moto" class="form-label text-warning fw-bold">Moto</label>
                  <select class="form-select bg-dark text-white border-warning" id="moto" th:field="*{moto}" required>
                    <option value="" disabled>Selecciona una moto</option>
                    <option th:each="m : ${motos}" th:value="${m.id}" th:text="${m.marca} + ' ' + ${m.tipoMotor}"></option>
                  </select>
                </div>
                <div class="mb-3">
                  <label for="equipo" class="form-label text-warning fw-bold">Equipo</label>
                  <select class="form-select bg-dark text-white border-warning" id="equipo" th:field="*{equipo}" required>
                    <option value="" disabled>Selecciona un equipo</option>
                    <option th:each="e : ${equipos}" th:value="${e.id}" th:text="${e.nombre}"></option>
                  </select>
                </div>
                <div class="row mb-3">
                  <div class="col-md-4">
                    <label for="num_carreras" class="form-label text-warning fw-bold">Nº Carreras</label>
                    <input type="number" class="form-control bg-dark text-white border-warning" id="num_carreras" th:field="*{num_carreras}" min="0" placeholder="0" required />
                  </div>
                  <div class="col-md-4">
                    <label for="dinero" class="form-label text-warning fw-bold">Dinero (€)</label>
                    <input type="number" class="form-control bg-dark text-white border-warning" id="dinero" th:field="*{dinero}" min="0" step="0.01" placeholder="0.00" required />
                  </div>
                  <div class="col-md-4">
                    <label for="puntos" class="form-label text-warning fw-bold">Puntos</label>
                    <input type="number" class="form-control bg-dark text-white border-warning" id="puntos" th:field="*{puntos}" min="0" placeholder="0" required />
                  </div>
                </div>
                <div class="row g-2">
                  <div class="col-md-6">
                    <button type="submit" class="btn btn-success w-100 py-2 fw-bold">Guardar Piloto</button>
                  </div>
                  <div class="col-md-6">
                    <button type="reset" class="btn btn-outline-warning w-100 py-2 fw-bold">Limpiar Formulario</button>
                  </div>
                </div>
              </form>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- Footer -->
    <footer class="bg-black text-white py-3 border-top border-warning">
      <div class="container text-center">
        <p class="mb-0">
          <span class="text-warning fw-bold">MOTO</span><span class="text-danger fw-bold">GP</span>
          &copy; 2025 - Todos los derechos reservados
        </p>
      </div>
    </footer>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>

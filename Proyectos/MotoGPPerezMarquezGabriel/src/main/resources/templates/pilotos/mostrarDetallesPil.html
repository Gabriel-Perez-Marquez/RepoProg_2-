<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MotoGP - Perfil del Piloto</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background: #0f0f0f;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }
        .content-wrapper {
            flex: 1;
        }
        .header-stripe-warning {
            height: 3px;
        }
        .header-stripe-danger {
            height: 2px;
        }
        .bg-gradient-card {
            background: linear-gradient(135deg, rgba(220,53,69,0.1) 0%, rgba(255,193,7,0.1) 100%);
            z-index: 0;
        }
        .top-border-gradient {
            height: 3px;
            background: linear-gradient(90deg, #dc3545 0%, #ffc107 100%);
            z-index: 1;
        }
        .main-card-header {
            background: linear-gradient(180deg, rgba(220,53,69,0.2) 0%, transparent 100%);
        }
        .badge-equipo {
            background: linear-gradient(135deg, #ffc107 0%, #ff9800 100%);
            color: #000;
            font-weight: 600;
            font-size: 0.9rem;
        }
        .circle-id {
            width: 90px;
            height: 90px;
            background: linear-gradient(135deg, #dc3545 0%, #c82333 100%);
            border: 3px solid #ffc107;
            box-shadow: 0 4px 15px rgba(220,53,69,0.5);
        }
        .circle-id-text {
            font-size: 2.5rem;
            color: white;
        }
        .stat-yellow {
            background: linear-gradient(135deg, rgba(255,193,7,0.15) 0%, rgba(255,193,7,0.05) 100%);
            border-left: 3px solid #ffc107;
        }
        .stat-red {
            background: linear-gradient(135deg, rgba(220,53,69,0.15) 0%, rgba(220,53,69,0.05) 100%);
            border-left: 3px solid #dc3545;
        }
        .stat-green {
            background: linear-gradient(135deg, rgba(40,167,69,0.15) 0%, rgba(40,167,69,0.05) 100%);
            border-left: 3px solid #28a745;
        }
        .stat-money {
            font-size: 2rem;
            font-weight: 700;
            color: #28a745;
        }
        .stat-money-euro {
            font-size: 0.9rem;
        }
        .moto-info-card {
            background: linear-gradient(135deg, rgba(255,193,7,0.1) 0%, rgba(220,53,69,0.1) 100%);
            border: 2px solid rgba(255,193,7,0.3);
        }
        .moto-info-inner {
            background: rgba(0,0,0,0.3);
        }
        .moto-info-title {
            font-size: 1.1rem;
            letter-spacing: 1px;
        }
        .moto-info-label {
            font-size: 0.7rem;
            letter-spacing: 1px;
        }
        .moto-info-value {
            font-size: 1.1rem;
        }
        .btn-back {
            background: linear-gradient(135deg, #6c757d 0%, #5a6268 100%);
            border: 2px solid #adb5bd;
            color: white;
            letter-spacing: 1px;
            font-size: 0.85rem;
            transition: all 0.3s ease;
        }
        .btn-back:hover {
            background: linear-gradient(135deg, #5a6268 0%, #545b62 100%);
            transform: scale(1.02);
        }
        .btn-edit {
            background: linear-gradient(135deg, #ffc107 0%, #ff9800 100%);
            border: 2px solid #dc3545;
            color: #000;
            letter-spacing: 1px;
            font-size: 0.85rem;
            transition: all 0.3s ease;
            box-shadow: 0 4px 10px rgba(255,193,7,0.3);
        }
        .btn-edit:hover {
            background: linear-gradient(135deg, #dc3545 0%, #c82333 100%);
            color: white;
            transform: scale(1.02);
        }
        .btn-edit:not(:hover) {
            color: #000;
        }
    </style>
</head>
<body class="text-light">
    <div class="content-wrapper">
        <!-- Header stripes -->
        <div class="bg-warning header-stripe-warning"></div>
        <div class="bg-danger header-stripe-danger"></div>
    
    <nav th:replace="~{fragmentos/navbar :: navbar}"></nav>

    <!-- Main Content -->
    <div class="container py-4">
        <!-- Page Header -->
        <div class="row mb-3">
            <div class="col-12">
                <a th:href="@{/pilotos}" class="btn btn-outline-warning btn-sm">
                    ← Volver a Pilotos
                </a>
            </div>
        </div>

        <!-- Perfil del Piloto -->
        <div class="row justify-content-center">
            <div class="col-lg-10">
                <!-- Card principal del piloto -->
                <div class="card bg-black text-white border-0 shadow-lg position-relative overflow-hidden mb-3">
                    <!-- Efecto de fondo con gradiente -->
                    <div class="position-absolute w-100 h-100 bg-gradient-card"></div>
                    <!-- Borde superior decorativo -->
                    <div class="position-absolute top-0 w-100 top-border-gradient"></div>
                    <div class="position-relative" style="z-index: 2;">
                        <!-- Header con nombre y número -->
                        <div class="p-4 pb-3 main-card-header">
                            <div class="row align-items-center">
                                <div class="col-md-8">
                                    <h1 class="display-5 fw-bold mb-2">
                                        <span class="text-warning" th:text="${piloto.nombre}">Nombre del Piloto</span>
                                    </h1>
                                    <p class="mb-0">
                                        <span class="badge px-3 py-2 badge-equipo" th:if="${piloto.equipo}">
                                            👥 <span th:text="${piloto.equipo.nombre}">Equipo</span>
                                        </span>
                                    </p>
                                </div>
                                <div class="col-md-4 text-md-end mt-3 mt-md-0">
                                    <div class="d-inline-flex align-items-center justify-content-center rounded-circle circle-id">
                                        <span class="fw-bold circle-id-text" th:text="${piloto.id}">1</span>
                                    </div>
                                </div>
                            </div>
                        </div>

                        <!-- Estadísticas principales (CORREGIDO) -->
                        <div class="p-4 pt-3">
                            <div class="row g-3 mb-4">
                                <!-- Puntos -->
                                <div class="col-md-6 col-lg-3">
                             <div class="p-3 rounded-3 stat-yellow">
                                        <div class="d-flex align-items-center mb-1">
                                            <span style="font-size: 1.2rem;">⭐</span>
                                            <small class="text-warning ms-2 text-uppercase" style="font-size: 0.7rem; letter-spacing: 1px; font-weight: 600;">Puntos</small>
                                        </div>
                                        <strong class="text-white d-block" style="font-size: 2rem; font-weight: 700;" th:text="${piloto.totalPuntos}">0</strong>
                                    </div>
                                </div>
                                
                                <!-- Victorias -->
                                <div class="col-md-6 col-lg-3">
                             <div class="p-3 rounded-3 stat-yellow">
                                        <div class="d-flex align-items-center mb-1">
                                            <span style="font-size: 1.2rem;">🏆</span>
                                            <small class="text-warning ms-2 text-uppercase" style="font-size: 0.7rem; letter-spacing: 1px; font-weight: 600;">Victorias</small>
                                        </div>
                                        <strong class="text-white d-block" style="font-size: 2rem; font-weight: 700;" th:text="${piloto.totalVictorias}">0</strong>
                                    </div>
                                </div>
                                
                                <!-- Podios -->
                                <div class="col-md-6 col-lg-3">
                             <div class="p-3 rounded-3 stat-red">
                                        <div class="d-flex align-items-center mb-1">
                                            <span style="font-size: 1.2rem;">🥈</span>
                                            <small class="text-danger ms-2 text-uppercase" style="font-size: 0.7rem; letter-spacing: 1px; font-weight: 600;">Podios</small>
                                        </div>
                                        <strong class="text-white d-block" style="font-size: 2rem; font-weight: 700;" th:text="${piloto.totalPodios}">0</strong>
                                    </div>
                                </div>
                                
                                <!-- Carreras -->
                                <div class="col-md-6 col-lg-3">
                             <div class="p-3 rounded-3 stat-red">
                                        <div class="d-flex align-items-center mb-1">
                                            <span style="font-size: 1.2rem;">🏁</span>
                                            <small class="text-danger ms-2 text-uppercase" style="font-size: 0.7rem; letter-spacing: 1px; font-weight: 600;">Carreras</small>
                                        </div>
                                        <strong class="text-white d-block" style="font-size: 2rem; font-weight: 700;" th:text="${piloto.totalCarreras}">0</strong>
                                    </div>
                                </div>
                            </div>
                            
                            <!-- Ganancias -->
                       <div class="p-3 rounded-3 mb-4 stat-green">
                                <div class="d-flex align-items-center mb-1">
                                    <span style="font-size: 1.2rem;">💰</span>
                                    <small class="text-success ms-2 text-uppercase" style="font-size: 0.7rem; letter-spacing: 1px; font-weight: 600;">Dinero</small>
                                </div>
                                <strong class="d-block stat-money">
                                    <span th:text="${#numbers.formatDecimal(piloto.dinero, 1, 'COMMA', 2, 'POINT')}">0.00</span>
                                    <small class="stat-money-euro">€</small>
                                </strong>
                            </div>
                            

                            <!-- Información de la Moto -->
                       <div class="p-3 rounded-3 mb-3 moto-info-card" th:if="${piloto.moto != null}">
                                <div class="d-flex align-items-center mb-3">
                                    <span style="font-size: 1.5rem;">🏍️</span>
                                    <h3 class="ms-2 mb-0 text-warning fw-bold moto-info-title">INFORMACIÓN DE LA MOTO</h3>
                                </div>
                                
                                <div class="row g-2">
                                    <div class="col-md-6">
                                        <div class="p-2 rounded moto-info-inner">
                                            <small class="text-warning d-block mb-1 text-uppercase moto-info-label">Marca</small>
                                            <strong class="text-white moto-info-value" th:text="${piloto.moto.marca}">Marca Moto</strong>
                                        </div>
                                    </div>
                                    <div class="col-md-6">
                                        <div class="p-2 rounded moto-info-inner">
                                            <small class="text-warning d-block mb-1 text-uppercase moto-info-label">Cilindrada</small>
                                            <strong class="text-white moto-info-value"><span th:text="${piloto.moto.cilindrada}">0</span> cc</strong>
                                        </div>
                                    </div>
                                    <div class="col-md-6">
                                        <div class="p-2 rounded moto-info-inner">
                                            <small class="text-warning d-block mb-1 text-uppercase moto-info-label">Tipo de Motor</small>
                                            <strong class="text-white moto-info-value" th:text="${piloto.moto.tipoMotor}">Tipo</strong>
                                        </div>
                                    </div>
                                    <div class="col-md-6">
                                        <div class="p-2 rounded moto-info-inner">
                                            <small class="text-warning d-block mb-1 text-uppercase moto-info-label">Desgaste</small>
                                            <strong class="text-danger moto-info-value"><span th:text="${piloto.moto.porcentDesgaste}">0</span> %</strong>
                                        </div>
                                    </div>
                                </div>
                            </div>

                            <!-- Botones de acción -->
                            <div class="row g-2">
                                <div class="col-md-6">
                                    <a th:href="@{/pilotos}"
                                       class="btn w-100 py-2 fw-bold text-uppercase btn-back">
                                        ← Volver a Lista
                                    </a>
                                </div>
                                <div class="col-md-6">
                                    <a th:href="@{/pilotos/edit/{id}(id=${piloto.id})}"
                                       class="btn w-100 py-2 fw-bold text-uppercase btn-edit">
                                        ✏️ Editar Piloto
                                    </a>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    </div>

    <!-- Footer -->
    <footer class="bg-black text-white py-3 border-top border-warning">
        <div class="container text-center">
            <p class="mb-0">
                <span class="text-warning fw-bold">MOTO</span><span class="text-danger fw-bold">GP</span> 
                &copy; 2025 - Todos los derechos reservados
            </p>
        </div>
    </footer>
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
